<div class="pet-card pet-card__bs" area-label="Best seller card">
    <div class="pet-card__img pet-card-bs__img">
        <img src="./img/card_fake_img.avif" alt="pet image" />
    </div>
    <div
        class="pet-card__info pet-card-bs__info"
        area-label="Best seller card info"
    >
        <div class="pet-card__main pet-card-bs__main">
            <h4 class="pet-card__title pet-card-bs__title">Lorem Ipsum</h4>
            <div
                class="pet-card__descr pet-card-bs__descr"
                area-label="Best seller card description"
            >
                Lorem ipsum dolor sit, amet consectetur adipisicing elit.
                Eveniet ipsum voluptates repellendus in quas, officia
                praesentium architecto iure possimus error quia saepe. Impedit
                illo fugiat quidem non tempore! Eaque, dolores.
            </div>
            <div class="pet-card-bs__rating" area-label="Best seller rating">
                <span class="pet-card-bs__star"
                    ><img src="./img/icons/icons.svg#star" alt="star logo"
                /></span>
                <span
                    class="pet-card-bs__rating-num"
                    area-label="Card rating number"
                    >(4.5)</span
                >
            </div>
        </div>
        <div class="pet-card-bs__bottom">
            <button class="button">Add to cart</button>
            <div class="pet-card-bs__price" area-label="Card price">
                <span class="pet-card-bs__old-plice" area-label="Old price"
                    >$160,00</span
                >
                <span class="pet-card-bs__new-plice" area-label="Actual price"
                    >$120,00</span
                >
            </div>
        </div>
    </div>
</div>
